name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            # Source bash profile to ensure node and pm2 are on PATH
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # Navigate to project folder
            cd /var/www/saim_web

            # Pull latest changes from main branch
            git pull origin main

            # If .env does not exist on live server, create baseline from .env.example
            if [ ! -f .env ] && [ ! -f .env.local ] && [ ! -f .env.production ] && [ -f .env.example ]; then
              cp .env.example .env
              echo "Created initial .env from .env.example"
            fi

            # Install dependencies and build
            npm install --production=false
            npm run build

            # Restart application with PM2 on port 3010
            pm2 reload saim_web --update-env || PORT=3010 pm2 start npm --name "saim_web" -- start -- -p 3010
            pm2 save
